/* ---- Animazione di avvio: "Digital Gate" (ispirata al varco digitale e al codice digitale di Digimon) */
/* intro Digital Gate (Digivice, 1,9 s): Salta animazione, Esc, movimento ridotto */
.dg-boot{--dg-boot-navy:#0b1120;--dg-boot-orange:#ff7a3d;--dg-boot-cyan:#63d5ee;position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:var(--dg-boot-navy);color:#f1f4f9;isolation:isolate;font-family:var(--font-body,'IBM Plex Sans',system-ui,sans-serif);opacity:0;pointer-events:none;visibility:hidden;}
.dg-boot.is-pending{visibility:visible;opacity:1;pointer-events:auto;}
.dg-boot.is-running{visibility:visible;opacity:1;pointer-events:auto;cursor:pointer;animation:dg-boot-exit 169ms 1066ms ease-out forwards;}
.dg-boot__ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,#17314b 0%,#0b1120 54%);opacity:.88;}
.dg-boot__grid{position:absolute;inset:0;background-image:linear-gradient(#63d5ee0a 1px,transparent 1px),linear-gradient(90deg,#63d5ee0a 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 46%,#000 4%,transparent 65%);pointer-events:none;}
.dg-boot__content{position:relative;display:flex;align-items:center;flex-direction:column;width:100%;padding:24px;transform:translateY(-10px);}
.dg-boot__portal{position:relative;display:grid;place-items:center;width:240px;height:240px;margin-bottom:25px;}
.dg-boot__ring{position:absolute;inset:0;border:1px solid #63d5ee36;border-radius:50%;opacity:0;}
.dg-boot__ring::before{content:'';position:absolute;inset:-1px;border:5px solid transparent;border-top-color:var(--dg-boot-cyan);border-right-color:var(--dg-boot-cyan);border-radius:50%;transform:rotate(-45deg);}
.dg-boot__ring--outer{inset:-19px;border-color:#ff7a3d35;}
.dg-boot__ring--outer::before{border-top-color:var(--dg-boot-orange);border-right-color:transparent;border-left-color:var(--dg-boot-orange);}
.dg-boot__ring--inner{inset:15px;border-color:#63d5ee1f;}
.dg-boot__ring--inner::before{border-right-color:transparent;}
.dg-boot__mark{position:relative;z-index:2;width:204px;height:204px;display:block;opacity:0;transform:scale(.9);}
.dg-boot__screenlight{position:absolute;z-index:3;width:57px;height:57px;left:calc(50% - 28px);top:calc(50% - 29px);border-radius:50%;background:radial-gradient(circle,#63d5ee26 0%,#63d5ee12 40%,transparent 72%);opacity:0;pointer-events:none;}
.dg-boot__pixel{position:absolute;width:4px;height:4px;background:var(--dg-boot-cyan);opacity:0;--dg-start-x:0px;--dg-start-y:0px;}
.dg-boot__pixel:nth-of-type(3n){background:var(--dg-boot-orange);}
.dg-boot__wordmark{font:700 italic clamp(27px,7vw,40px)/1.1 var(--font-display,'Chakra Petch',system-ui,sans-serif);letter-spacing:.02em;text-align:center;margin:0;opacity:0;transform:translateY(8px);}
.dg-boot__subtitle{font:600 11px/1.5 var(--font-display,'Chakra Petch',system-ui,sans-serif);letter-spacing:.3em;color:var(--dg-boot-cyan);text-align:center;margin:10px 0 0;opacity:0;}
.dg-boot__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;}
.dg-boot.is-running .dg-boot__ring{animation:dg-boot-ring 1072ms 0ms cubic-bezier(.2,.8,.2,1) both;}
.dg-boot.is-running .dg-boot__ring--outer{animation-duration:1138ms;animation-delay:26ms;}
.dg-boot.is-running .dg-boot__ring--inner{animation-duration:1027ms;animation-delay:72ms;}
.dg-boot.is-running .dg-boot__mark{animation:dg-boot-mark 942ms 104ms ease-out both;}
.dg-boot.is-running .dg-boot__screenlight{animation:dg-boot-light 812ms 247ms ease-in-out both;}
.dg-boot.is-running .dg-boot__wordmark{animation:dg-boot-word 247ms 494ms cubic-bezier(.2,.8,.2,1) both;}
.dg-boot.is-running .dg-boot__subtitle{animation:dg-boot-subtitle 195ms 611ms ease-out both;}
.dg-boot.is-running .dg-boot__pixel{animation:dg-boot-pixel 494ms var(--dg-delay,0ms) ease-out both;}
@keyframes dg-boot-ring{0%{opacity:0;transform:rotate(-38deg) scale(.76)}20%{opacity:.8}70%{opacity:.72;transform:rotate(26deg) scale(1)}100%{opacity:0;transform:rotate(43deg) scale(1.32)}}
@keyframes dg-boot-mark{0%{opacity:0;transform:scale(.88)}22%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.04)}}
@keyframes dg-boot-light{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1.3)}70%{opacity:.8;transform:scale(1.1)}100%{opacity:0;transform:scale(2.3)}}
@keyframes dg-boot-word{to{opacity:1;transform:translateY(0)}}
@keyframes dg-boot-subtitle{to{opacity:1}}
@keyframes dg-boot-pixel{0%{opacity:0;transform:translate(var(--dg-start-x),var(--dg-start-y)) scale(1)}16%{opacity:.75}100%{opacity:0;transform:translate(0,0) scale(.2)}}
@keyframes dg-boot-exit{to{opacity:0;visibility:hidden;pointer-events:none}}
@media(max-width:380px){.dg-boot__portal{width:214px;height:214px;margin-bottom:22px}.dg-boot__mark{width:184px;height:184px}.dg-boot__ring--outer{inset:-14px}}
@media(prefers-reduced-motion:reduce){.dg-boot.is-running{animation:none}.dg-boot__ring,.dg-boot__pixel,.dg-boot__screenlight{display:none!important}.dg-boot.is-running .dg-boot__mark,.dg-boot.is-running .dg-boot__wordmark,.dg-boot.is-running .dg-boot__subtitle{animation:none;opacity:1;transform:none}}

        var row = el("div", "dacts"), later = el("button", "dbtn", "Più tardi"), inst = el("button", "dbtn on", "Installa");
        later.type = inst.type = "button";
        later.onclick = function () { sc.remove(); };

      }).catch(function () {});
  }
  setTimeout(checkUpdate, 1500);
  // ---- APK: il gesto/tasto "indietro" di Android torna alla schermata precedente invece di chiudere l'app.
  // Nella scheda della singola carta il gesto non fa nulla (lì si usano gli swipe della scheda).
  (function () {
    var AppP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (!AppP || !AppP.addListener) return;

      if (closeFilters()) return;
      if (menuEl.classList.contains("open")) { menuOpen(false); return; }
      if (st.open != null) return;
      var atHome = st.tab === "home" && !st.setId;
      if (history.state && history.state.d > 0) { history.back(); return; }
      if (st.tab === "deck" && st.deckId) { st.deckId = null; render(); return; }
      if (st.tab === "cards" && st.setId) { goSets(); return; }
      if (!atHome) { go("home"); return; }
      if (AppP.minimizeApp) AppP.minimizeApp(); else if (AppP.exitApp) AppP.exitApp();
    });
  })();
  var statsReady = false;
  function recomputeStatsIfNeeded() { if (!statsReady) { recomputeStats(); statsReady = true; } }
  render();
})();
</script>
<script>
/* Digital Gate: intro di 1.9 secondi, senza dipendenze e senza richieste di rete. */
(() => {
  'use strict';
  const durations = { normal: 1240, reduced: 180 };
  const sessionKey = 'dg-splash';
  function mount(element, options = {}) {
    if (!element) return null;
    let timer = null, running = false, priorFocus = null;
    const inertStates = new Map();
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    function release() {
      for (const [node, wasInert] of inertStates) node.inert = wasInert;
      inertStates.clear();
    }
    function finish() {
      if (!running) return;
      running = false;
      clearTimeout(timer);
      element.classList.remove('is-running');
      element.setAttribute('aria-hidden', 'true');
      release();
      if (priorFocus?.isConnected && priorFocus !== document.body) priorFocus.focus({ preventScroll: true });
      element.dispatchEvent(new CustomEvent('digitalgate:bootend', { bubbles: true }));
    }
    function play() {
      clearTimeout(timer);
      if (running) { element.classList.remove('is-running'); release(); }
      priorFocus = document.activeElement;
      element.setAttribute('aria-hidden', 'false');
      if (options.inertTargets) for (const node of options.inertTargets) {
        if (node && !node.contains(element)) { inertStates.set(node, node.inert); node.inert = true; }
      }
      element.classList.remove('is-running');
      void element.offsetWidth;
      running = true;
      element.classList.add('is-running');
      timer = setTimeout(finish, reduced.matches ? durations.reduced : durations.normal);
      return timer;
    }
    const onEscape = e => { if (running && e.key === 'Escape') { e.preventDefault(); finish(); } };
    const onVisibility = () => { if (document.hidden) finish(); };
    const onMotion = () => { if (running && reduced.matches) finish(); };
    // un tap o un clic in qualsiasi punto chiude l'intro (solo 'click': il tocco non passa ai pulsanti sotto)
    element.addEventListener('click', finish);
    document.addEventListener('keydown', onEscape);
    document.addEventListener('visibilitychange', onVisibility);
    reduced.addEventListener('change', onMotion);
    element.setAttribute('aria-hidden', 'true');
    return {
      play, finish,
      get running() { return running; },
      destroy() {
        finish();
        element.removeEventListener('click', finish);
        document.removeEventListener('keydown', onEscape);
        document.removeEventListener('visibilitychange', onVisibility);
        reduced.removeEventListener('change', onMotion);
      },
      startOnce() {
        let seen = false;
        try { seen = sessionStorage.getItem(sessionKey) === '1'; sessionStorage.setItem(sessionKey, '1'); } catch (_) {}
        const skipRequested = new URLSearchParams(location.search).has('nosplash');
        if (!seen && !skipRequested) play();
        return !seen && !skipRequested;
      }
    };
  }

})();
(function () {
  // una sola intro: sul sito una volta per sessione (dg-splash), nell'APK a ogni avvio; ?nosplash la salta
  var el = document.getElementById("dg-boot"); if (!el || !window.DigitalGateBoot) return;
  var apk = !!window.Capacitor || /^capacitor:/.test(location.protocol);
  var boot = DigitalGateBoot.mount(el, { inertTargets: [document.querySelector(".bar"), document.querySelector("main"), document.getElementById("menu"), document.getElementById("tabbar")].filter(Boolean) });
  if (!boot) return;
  el.addEventListener("digitalgate:bootend", function () { setTimeout(function () { if (!boot.running) el.hidden = true; }, 300); });
  if (apk) { try { sessionStorage.setItem("dg-splash", "1"); } catch (e) {} if (!/[?&]nosplash/.test(location.search)) boot.play(); else el.hidden = true; }
  else if (!boot.startOnce()) el.hidden = true;
  el.classList.remove("is-pending");
})();
</script>
