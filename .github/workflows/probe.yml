name: Probe immagini
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: taka-webp BT9-112
        run: curl -sS -f -o a.webp -w "%{http_code} %{content_type} %{size_download}\n" https://web-garage.takaotaku.de/BT9-112.webp && file a.webp && ls -l a.webp
      - name: taka-webp LM-057 (set recente)
        run: curl -sS -f -o b.webp -w "%{http_code} %{content_type} %{size_download}\n" https://web-garage.takaotaku.de/LM-057.webp
      - name: taka-webp BT26-001 (set recente)
        run: curl -sS -f -o c.webp -w "%{http_code} %{content_type} %{size_download}\n" https://web-garage.takaotaku.de/BT26-001.webp
      - name: ufficiale world png BT9-112
        run: curl -sS -f -o d.png -w "%{http_code} %{content_type} %{size_download}\n" https://world.digimoncard.com/images/cardlist/card/BT9-112.png
      - name: ufficiale en png BT9-112
        run: curl -sS -f -o e.png -w "%{http_code} %{content_type} %{size_download}\n" https://en.digimoncard.com/images/cardlist/card/BT9-112.png
      - name: dimensioni (richiede successi sopra)
        if: always()
        run: ls -l *.webp *.png 2>/dev/null; file *.webp *.png 2>/dev/null; echo "::notice title=sizes::$(ls -l *.webp *.png 2>/dev/null | awk '{print $5, $9}' | tr '\n' ';')"
