name: Sito e APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: www/img
          key: img-v1-${{ hashFiles('src/data.json', 'src/errata/*') }}
          restore-keys: img-v1-
      - run: pip install pillow
      - run: python3 tools/build.py
      - run: python3 tools/fetch_images.py
      - run: python3 tools/fetch_banners.py
      - run: python3 tools/fetch_product_images.py
      - run: python3 tools/apply_errata_images.py
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: |
            www
            !www/img
  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Firma fissa e numero di versione (aggiornamenti senza disinstallare)
        run: |
          mkdir -p ~/.android && cp android-keys/debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DigimonSetTracker.apk
      - name: Pubblica APK nella release "latest"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 5
          gh release create latest DigimonSetTracker.apk --title "APK più recente · build ${{ github.run_number }}" --notes "Scarica DigimonSetTracker.apk e installalo sul telefono. build: ${{ github.run_number }}" --target "${{ github.sha }}" --latest
          sleep 5
          gh release edit latest --draft=false || true
          gh release view latest --json isDraft,name
