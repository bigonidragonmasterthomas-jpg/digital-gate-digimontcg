name: Loghi e artwork set
# Scarica dal sito ufficiale Bandai loghi e artwork promozionali di tutte le espansioni
# e li salva nel branch "set-assets" (con galleria README.md, index.json e anteprima.jpg).
# Si avvia a mano (Actions → "Loghi e artwork set" → Run workflow) e ogni lunedì per prendere i set nuovi.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: write
concurrency:
  group: set-assets
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Scarica loghi e artwork
        shell: bash
        run: |
          mkdir -p out
          python3 tools/fetch_set_assets.py out | tee out/log.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/realesrgan_anime6b.pth
          key: realesrgan-anime6b
      - name: Ingrandisci con AI le bustine piccole (Real-ESRGAN)
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q spandrel numpy
          git fetch -q --depth 1 origin set-assets && git worktree add -q --detach prev FETCH_HEAD || true
          PREV=prev python3 tools/upscale_packs.py out
          git worktree remove --force prev || true
      - name: Salva nel branch set-assets
        shell: bash
        run: |
          set -eE
          trap 'echo "::error title=Salvataggio::riga $LINENO: $BASH_COMMAND"' ERR
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git fetch -q --depth 1 origin set-assets; then
            git worktree add -q -B set-assets br FETCH_HEAD
          else
            git worktree add -q --detach br
            git -C br checkout -q --orphan set-assets
          fi
          git -C br rm -rqf --ignore-unmatch .
          cp -r out/. br/
          rm -f br/log.txt
          git -C br add -A
          if git -C br diff --cached --quiet; then
            echo "Nessuna novità rispetto all'ultima esecuzione"
          else
            git -C br commit -qm "Loghi e artwork aggiornati (run ${{ github.run_number }})"
            git -C br push origin set-assets 2>&1 | tail -5 | sed 's/^/::warning title=push::/'
            test "${PIPESTATUS[0]}" -eq 0
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: loghi-e-artwork
          path: out
          retention-days: 30
